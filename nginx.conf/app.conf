        location ~ \.php$ {
                #fastcgi_pass   127.0.0.1:9000;
                fastcgi_pass   unix:/dev/shm/php-cgi.sock;
                fastcgi_index  index.php;
                include fastcgi.conf;
        }
        location ^~ /app {
                deny all;
        }
        location ~* /(upload|runtime)/.*\.(php|php5|py|sh|so|html|htm|js)$ {
                deny all;
        }
        location ~* \.(pem|key|sql|log|env|proto)$ {
                deny  all;
        }
        location ~* \.(gif|jpg|jpeg|png|bmp|swf)$ {
                expires      30d;
        }
        location ~* \.(js|css)?$ {
                expires      30d;
        }
