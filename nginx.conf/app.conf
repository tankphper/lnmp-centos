        location ^~ /app/ {
                deny all;
                access_log off;
        }
        location ^~ /runtime/ {
                deny all;
                access_log off;
        }
        location ~* /upload/.*\.(php|php2|php3|php4|php5|php7|php8|phtml|py|sh|so|html|htm|js)$ {
                if (-e $request_filename) {
                        return 403;
                }
        }
        # 禁止访问以点开头的隐藏文件，well-known 除外
        location ~ /\.(?!well-known) {
                deny all;
                access_log off;
        }
        # 拦截全站敏感配置文件、密钥、备份文件
        location ~* \.(pem|key|sql|log|env|json|proto|bak|config|ini|git|swp)$ {
                deny all;
                access_log off;
        }
        location ~ \.php$ {
                #fastcgi_pass   127.0.0.1:9000;
                fastcgi_pass   unix:/dev/shm/php-cgi.sock;
                fastcgi_index  index.php;
                include fastcgi.conf;
                # 强制透传最准确的访客物理 IP 给 PHP
                fastcgi_param  REMOTE_ADDR $remote_addr;
        }
        location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|webp)$ {
                expires      30d;
                access_log   off;
        }
        location ~* \.(js|css)$ {
                expires      30d;
                access_log   off;
        }
